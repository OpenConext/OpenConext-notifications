server:
  port: 8082
  # behind the Apache of the client image / a load balancer, for the OIDC redirect uri
  forward-headers-strategy: framework
  error:
    include-message: always

spring:
  application:
    name: notifications
  datasource:
    url: jdbc:mariadb://localhost:3306/notifications
    username: notifications
    password: secret
  flyway:
    enabled: true
  jpa:
    hibernate:
      # the schema is owned by the Flyway migrations
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          oidcng:
            client-id: playground_client
            client-secret: secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: "authorization_code"
            scope: openid,email
            provider: oidcng
        provider:
          oidcng:
            authorization-uri: "https://connect.test2.surfconext.nl/oidc/authorize"
            token-uri: "https://connect.test2.surfconext.nl/oidc/token"
            user-info-uri: "https://connect.test2.surfconext.nl/oidc/userinfo"
            jwk-set-uri: "https://connect.test2.surfconext.nl/oidc/certs"
            user-name-attribute: sub
            user-info-authentication-method: client_secret_basic
      # Bearer tokens on the CRUD API are validated with token introspection
      resourceserver:
        opaquetoken:
          introspection-uri: "https://connect.test2.surfconext.nl/oidc/introspect"
          client-id: playground_client
          client-secret: secret

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# The applications that notifications can be created for. Each target app is also the
# (basic authentication) username of the server-to-server API: /api/external/notifications.
# We don't encode the passwords, they are injected from the deployment.
notifications:
  target-apps:
    - name: myconext
      password: secret
    - name: servicedesk
      password: secret
