# Local run of the packaged application: mvn clean install && docker compose up --build
services:
  mariadb:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: notifications
      MARIADB_USER: notifications
      MARIADB_PASSWORD: secret
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  notificationsserver:
    build:
      context: server
      dockerfile: docker/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/notifications
      SPRING_DATASOURCE_USERNAME: notifications
      SPRING_DATASOURCE_PASSWORD: secret
      # fake login, remove to use the OIDC provider of application.yml
      SPRING_PROFILES_ACTIVE: local

  notificationsclient:
    build:
      context: client
      dockerfile: docker/Dockerfile
    depends_on:
      - notificationsserver
    ports:
      - "8080:80"
