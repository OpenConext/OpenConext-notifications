---
# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'client/.nvmrc'
#      - name: Yarn Audit client
#        run: yarn audit --level high --groups dependencies
#        working-directory: client
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Set up MySQL
        uses: shogo82148/actions-setup-mysql@v1
        with:
          distribution: "mariadb"
          mysql-version: "10.6"
      - run: |
          mysql -uroot -h127.0.0.1 -e \
          "CREATE DATABASE notifications CHARACTER SET utf8mb4 \
          COLLATE utf8mb4_unicode_ci;"
      - run: |
          mysql -uroot -h127.0.0.1 -e \
          "CREATE USER 'notifications'@'localhost' IDENTIFIED BY 'secret';";
      - run: |
          mysql -uroot -h127.0.0.1 -e \
          "GRANT ALL privileges ON notifications.* TO 'notifications'@'localhost';"
      - name: Install the Playwright browser
        run: |
          yarn install --frozen-lockfile
          yarn playwright install --with-deps chromium
        working-directory: client
      - name: Build with Maven, including the e2e tests
        run: mvn clean install -Pe2e --file pom.xml
      - name: Upload the e2e test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: client/test-results/
          retention-days: 7
#      - name: Codecov
#        uses: codecov/codecov-action@v6
#        with:
#          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Generate coverage
        run: mvn -pl server test jacoco:report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: server/target/site/jacoco

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
#          - name: Deploy coverage report

#      - name: Deploy
#        uses: JamesIves/github-pages-deploy-action@v4
#        with:
#          branch: 'gh-pages'
#          folder: 'server/target/site/jacoco'
