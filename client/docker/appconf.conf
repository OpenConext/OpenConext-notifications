ServerName notificationsclient
RewriteEngine On
RewriteCond %{REQUEST_URI} !\.(js|css)(\.map)?$
RewriteCond %{REQUEST_URI} !\.svg$
RewriteCond %{REQUEST_URI} !\.png$
RewriteCond %{REQUEST_URI} !\.ico$
RewriteCond %{REQUEST_URI} !\.woff$
RewriteCond %{REQUEST_URI} !\.woff2$
RewriteCond %{REQUEST_URI} !\.ttf$
RewriteCond %{REQUEST_URI} !\.eot$
RewriteCond %{REQUEST_URI} !^/api/
RewriteCond %{REQUEST_URI} !^/config$
RewriteCond %{REQUEST_URI} !^/login/
RewriteCond %{REQUEST_URI} !^/oauth2/
RewriteCond %{REQUEST_URI} !^/logout$
RewriteCond %{REQUEST_URI} !^/internal/
RewriteRule (.*) /index.html [L]
ProxyPass /api http://notificationsserver:8082/api retry=0
ProxyPassReverse /api http://notificationsserver:8082/api
ProxyPass /config http://notificationsserver:8082/config retry=0
ProxyPassReverse /config http://notificationsserver:8082/config
ProxyPass /logout http://notificationsserver:8082/logout retry=0
ProxyPassReverse /logout http://notificationsserver:8082/logout
ProxyPassMatch ^/oauth2(.*)$ http://notificationsserver:8082
ProxyPassReverse /oauth2 http://notificationsserver:8082/oauth2
ProxyPassMatch ^/login(.*)$ http://notificationsserver:8082
ProxyPassReverse /login http://notificationsserver:8082/login
ProxyPassMatch ^/internal(.*)$ http://notificationsserver:8082
ProxyPassReverse /internal http://notificationsserver:8082/internal

# Tomcat rejects a Host header with an underscore (e.g. a docker container name): always pass the public host
ProxyPreserveHost On

DocumentRoot /var/www/

<Directory /var/www>
  Require all granted
  Options -Indexes
</Directory>

<FilesMatch "\.html$">
Header set Cache-Control "max-age=0, no-cache, no-store, must-revalidate"
Header set Expires "Sun, 8 Jun 1986 08:06:00 GMT"
</FilesMatch>

Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Content-Type-Options "nosniff"
