server:
  port: 8082
  # behind the Apache of the client image / a load balancer, for the OIDC redirect uri
  forward-headers-strategy: framework

spring:
  application:
    name: notifications
  datasource:
    url: jdbc:mariadb://localhost:3306/notifications?allowPublicKeyRetrieval=true
    username: notifications
    password: secret
  flyway:
    enabled: true
  jpa:
    hibernate:
      # the schema is owned by the Flyway migrations
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          oidcng:
            client-id: playground_client
            client-secret: secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: "authorization_code"
            scope: openid
            provider: oidcng
        provider:
          oidcng:
            authorization-uri: "https://connect.test2.surfconext.nl/oidc/authorize"
            token-uri: "https://connect.test2.surfconext.nl/oidc/token"
            user-info-uri: "https://connect.test2.surfconext.nl/oidc/userinfo"
            jwk-set-uri: "https://connect.test2.surfconext.nl/oidc/certs"
            user-name-attribute: sub
            user-info-authentication-method: client_secret_basic
  web:
    error:
      include-message: always

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
      base-path: "/internal"
  endpoint:
    info:
      access: unrestricted
    health:
      access: unrestricted
      show-details: when-authorized
  info:
    git:
      mode: full

# The applications that notifications can be created for. Each target app is also the
# (basic authentication) username of the server-to-server API: /api/external/notifications.
# We don't encode the passwords, they are injected from the deployment.
notifications:
  # Users must have this value in the claim edumember_is_member_of to be allowed to log in
  required-member-of: "urn:mace:surf.nl:invite.test2.surfconext.nl:12cbb06a-2af8-41e1-ac4e-6175cacd1307:surfconext_tpm_core"
  target-apps:
    - name: myconext
      password: secret
    - name: servicedesk
      password: secret
    - name: invite
      password: secret
    - name: access
      password: secret
    - name: dashboard
      password: secret
    - name: teams
      password: secret

# The resource cleaner removes the notifications that ended more than 5 days ago. Durations are ISO-8601,
# the lock makes sure only one node runs the cleaner (lock-at-least-for must be less than the cleaner-cron delay).
cron:
  cleaner-cron: "PT1H"
  cleaner-cron-initial-delay: "PT10S"
  cleaner-lock-at-least-for: "PT5M"
  cleaner-lock-at-most-for: "PT30M"
  notification-delete-after-days: 5
